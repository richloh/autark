<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Autark — the open-source, sovereign cloud control plane for your own hardware." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Autark</title>
    <script>
      try {
        var t = JSON.parse(localStorage.getItem('autark.ui') || '{}').state?.theme || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
